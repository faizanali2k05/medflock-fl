backend:
  image: python:3.11-slim
  stage: verify
  before_script:
    - pip install uv==0.11.33
    - uv sync --locked --extra dev
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
frontend:
  image: node:22-alpine
  stage: verify
  script:
    - cd frontend
    - npm ci
    - npm test
    - npm audit --audit-level=high
    - npm run build
  artifacts:
    paths: [src/medflock/resources/web/]
    expire_in: 7 days
