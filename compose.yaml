name: medflock
x-app: &app
  image: medflock:local
  build: .
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp", "/app/runtime:uid=10001,gid=10001"]
  environment: &environment
    MEDFLOCK_ENV: production
    MEDFLOCK_AUTH_REQUIRED: "true"
    MEDFLOCK_EMBEDDED_WORKER: "false"
    MEDFLOCK_API_KEY: ${MEDFLOCK_API_KEY:?Run scripts/configure.py}
    MEDFLOCK_ALLOWED_HOSTS: localhost,127.0.0.1,api
    MEDFLOCK_DATABASE_URL: postgresql+psycopg://medflock:${POSTGRES_PASSWORD:?Run scripts/configure.py}@db:5432/medflock
    MEDFLOCK_DATASET: /app/data/heart_failure.csv
    MEDFLOCK_ARTIFACTS: /app/artifacts
  volumes:
    - ./data:/app/data:ro
    - artifacts:/app/artifacts
  depends_on:
    db:
      condition: service_healthy
services:
  api:
    <<: *app
    ports: ["127.0.0.1:${MEDFLOCK_PORT:-8088}:8088"]
    mem_limit: 1g
    cpus: 1
  worker:
    <<: *app
    command: [python, -m, medflock.worker]
    healthcheck:
      disable: true
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 60s
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medflock
      POSTGRES_USER: medflock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U medflock -d medflock]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
volumes:
  artifacts:
  database:
