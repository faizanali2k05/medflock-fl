[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medflock-fl"
version = "0.2.0"
description = "A reproducible cardiology federated-learning research workbench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "flwr==1.39.0",
  "fastapi==0.138.2",
  "uvicorn==0.49.0",
  "sqlalchemy==2.1.4",
  "scikit-learn==1.6.1",
  "pandas==2.2.3",
  "psycopg[binary]==3.2.6",
  "httpx==0.28.1",
  "strawberry-graphql[fastapi]==0.335.0",
  "filelock==4.2.0",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "pyjwt[crypto]==2.15.1",
  "pillow==12.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.8"]
llm = [
    "peft==0.18.1",
    "torch==2.9.1",
    "transformers==4.57.6",
]
qlora = ["bitsandbytes==0.48.2"]

[project.scripts]
medflock = "medflock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medflock = ["resources/*.json", "resources/*.html", "resources/web/*", "resources/web/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.flwr.app]
publisher = "mashhood0x7E"

[tool.flwr.app.components]
serverapp = "medflock.federation:server_app"
clientapp = "medflock.federation:client_app"

[tool.flwr.app.config]
num-server-rounds = 3
num-clients = 3
local-epochs = 1
learning-rate = 0.05
server-manifest = ""
hospital-mode = false
