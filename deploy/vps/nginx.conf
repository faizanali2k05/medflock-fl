worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 21m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;
  limit_req_zone $binary_remote_addr zone=general:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  log_format safe '$remote_addr [$time_local] $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log safe;
  server {
    listen 8443 ssl;
    ssl_certificate /etc/medflock/tls/server.crt;
    ssl_certificate_key /etc/medflock/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_conn connections 8;
    location ~ /\. { deny all; }
    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://api:8088;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://api:8088;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 930s;
    }
  }
}
